name: Release

# Releases are NOT cut on merge to main — pushes only run CI.
# Instead this job runs on a schedule (monthly): it determines the next
# version from the Conventional Commits since the last tag. Only if there is a
# release-worthy change (a feat/fix/breaking-change commit) does it build and
# push the production Docker image to the GitHub Container Registry (ghcr.io),
# then create the git tag and cut a GitHub Release. The version is computed in
# dry-run mode and the tag is created only after the image is published, so a
# failed build never leaves a dangling tag behind. If nothing releasable has landed
# since the last tag, `new_version` is empty and every release step is skipped —
# a no-op run.
#
# To FORCE a release (e.g. after a docs-only or chore change), trigger it
# manually and pick a bump level:
#   * GitHub UI: Actions > Release > "Run workflow" > set "bump" to patch/minor/major.
#   * CLI:       gh workflow run release.yml -f bump=patch
# With `bump=auto` (the default) a manual run behaves exactly like the schedule:
# it releases only if a feat/fix/breaking-change commit has landed.
#
# Version bump rules (TriPSs/conventional-changelog-action, Conventional Commits):
#   - commit/PR title contains "BREAKING CHANGE" or "feat!:" -> major (x.0.0)
#   - commit/PR title starts with "feat:"                    -> minor (0.x.0)
#   - commit/PR title starts with "fix:"                     -> patch (0.0.x)
#   - anything else                                          -> no release (skipped)

on:
  schedule:
    - cron: "0 5 1 * *" # monthly (first of the month, 05:00 UTC)
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a release with this bump when no releasable commits exist (auto = behave like the schedule)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create/push the git tag + release
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history is required so the tagging action can read previous tags
          # and compute the next semantic version.
          fetch-depth: 0

      # Compute the next version from the Conventional Commits since the last
      # tag. `skip-commit`/`skip-version-file` make the action read the current
      # version from git tags (not from a version file), and with the
      # `conventionalcommits` preset the commit types hidden from the changelog
      # (docs, test, ci, chore, ...) yield an empty changelog, which
      # `skip-on-empty` turns into a skipped run - the same "nothing releasable
      # -> no release" behavior as before. Compute-only: no commit, no tag, no
      # push. The tag is created later by the release step, only after the
      # image is pushed, so a failed build never leaves an orphan tag behind.
      - name: Determine next version
        if: github.event_name != 'workflow_dispatch' || inputs.bump == 'auto'
        id: bump
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-prefix: v
          preset: conventionalcommits
          output-file: false
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          git-push: false
          skip-git-pull: true
          skip-on-empty: true

      # Manual override: a workflow_dispatch run with bump=patch|minor|major
      # forces that bump from the latest tag even when no releasable commit
      # exists (e.g. after a docs-only change).
      - name: Determine next version (manual bump)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'auto'
        id: manual
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION=${LAST_TAG#v}
          VERSION=${VERSION:-0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          {
            echo "version=$NEW_VERSION"
            echo "tag=v$NEW_VERSION"
            echo "changelog<<CHANGELOG_EOF"
            git log ${LAST_TAG:+"$LAST_TAG..HEAD"} --pretty='* %s (%h)'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Merge both paths into the `tag` outputs every later step reads.
      # `new_version` stays empty when there is nothing to release, keeping the
      # `if: steps.tag.outputs.new_version` guards working unchanged.
      - name: Resolve next version
        id: tag
        env:
          MANUAL_VERSION: ${{ steps.manual.outputs.version }}
          MANUAL_TAG: ${{ steps.manual.outputs.tag }}
          MANUAL_CHANGELOG: ${{ steps.manual.outputs.changelog }}
          AUTO_SKIPPED: ${{ steps.bump.outputs.skipped }}
          AUTO_VERSION: ${{ steps.bump.outputs.version }}
          AUTO_TAG: ${{ steps.bump.outputs.tag }}
          AUTO_CHANGELOG: ${{ steps.bump.outputs.changelog }}
        run: |
          set -euo pipefail
          NEW_VERSION=""
          NEW_TAG=""
          CHANGELOG=""
          if [ -n "$MANUAL_VERSION" ]; then
            NEW_VERSION=$MANUAL_VERSION
            NEW_TAG=$MANUAL_TAG
            CHANGELOG=$MANUAL_CHANGELOG
          elif [ "$AUTO_SKIPPED" = "false" ] && [ -n "$AUTO_VERSION" ]; then
            NEW_VERSION=$AUTO_VERSION
            NEW_TAG=$AUTO_TAG
            CHANGELOG=$AUTO_CHANGELOG
          fi
          {
            echo "new_version=$NEW_VERSION"
            echo "new_tag=$NEW_TAG"
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        if: steps.tag.outputs.new_version
        id: meta
        env:
          VERSION: ${{ steps.tag.outputs.new_version }}
        run: |
          set -euo pipefail
          # ghcr.io image names must be lowercase.
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          {
            echo "image=$IMAGE"
            echo "tags=$IMAGE:$VERSION,$IMAGE:$MAJOR.$MINOR,$IMAGE:$MAJOR,$IMAGE:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.new_version
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.new_version
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.tag.outputs.new_version
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: steps.tag.outputs.new_version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          # Create the tag on the checked-out branch tip now that the image is
          # published. This is the point at which the version tag comes into
          # existence (the version step above ran in compute-only mode).
          target_commitish: main
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
